name: Publicar versão do Kipper

# "Gerar não é publicar": a tag vX.Y.Z gera os arquivos e um RASCUNHO de versão (Instaladores do
# Kipper). Este fluxo só roda quando o criador pede, e torna o rascunho a versão oficial
# (releases/latest), depois de conferir que os arquivos do padrão (e os APKs do Android) estão lá.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 0.9.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    steps:
      - name: Conferir os arquivos e publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          tag="v${VERSAO#v}"
          padrao="Kipper-Windows.exe Kipper-Fedora.rpm Kipper-Ubuntu-Debian.deb Kipper-Linux.AppImage
                  Kipper-Flatpak.flatpak Kipper-Matsu-OS.flatpak Kipper-Android.apk Kipper-Android-32bits.apk
                  instalar.sh SHA256SUMS.txt atualizacoes.json"
          # Rascunhos desta versão, do mais novo para o mais antigo (uma tentativa que falhou pode ter
          # deixado um rascunho incompleto com a mesma etiqueta).
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  --jq "[.[] | select(.draft and .tag_name == \"$tag\")] | sort_by(.created_at) | reverse | .[].id")
          [ -n "$ids" ] || { echo "Não há rascunho da versão $tag."; exit 1; }
          escolhido=""
          for id in $ids; do
            nomes=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[].name')
            completo=1
            for f in $padrao; do echo "$nomes" | grep -qx "$f" || completo=0; done
            echo "rascunho $id: $([ $completo = 1 ] && echo completo || echo incompleto)"
            if [ $completo = 1 ] && [ -z "$escolhido" ]; then escolhido=$id; fi
          done
          [ -n "$escolhido" ] || { echo "Não publiquei: nenhum rascunho de $tag tem todos os arquivos do padrão."; exit 1; }
          # Os outros rascunhos da mesma versão nunca foram públicos; sem eles, a etiqueta fica de um só.
          for id in $ids; do
            [ "$id" = "$escolhido" ] || { echo "apagando rascunho repetido $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$escolhido" -F draft=false -f make_latest=true >/dev/null
          echo "### Kipper $tag publicado" >> "$GITHUB_STEP_SUMMARY"
